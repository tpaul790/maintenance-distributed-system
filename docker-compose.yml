name: maintenance

services:
  postgres:
    image: postgres:16-alpine
    container_name: maintenance-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maintenance_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - maintenance-net

  liquibase:
    image: liquibase/liquibase:4.29
    container_name: maintenance-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./liquibase/changelog:/liquibase/changelog:ro
    command:
      - --changelog-file=changelog/db.changelog-master.yaml
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-maintenance_db}
      - --username=${POSTGRES_USER:-postgres}
      - --password=${POSTGRES_PASSWORD:-postgres}
      - update
    restart: "no"
    networks:
      - maintenance-net

  auth-service:
    build: ./auth-service
    container_name: maintenance-auth-service
    depends_on:
      postgres:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-maintenance_db}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-change-me-please-use-a-long-random-secret-at-least-32-chars}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
    ports:
      - "8081:8081"
    networks:
      - maintenance-net

  api-gateway:
    build: ./api-gateway
    container_name: maintenance-api-gateway
    depends_on:
      - auth-service
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
      TENANT_SERVICE_URL: ${TENANT_SERVICE_URL:-http://tenant-service:8082}
      UTILITY_SERVICE_URL: ${UTILITY_SERVICE_URL:-http://utility-service:8083}
      JWT_SECRET: ${JWT_SECRET:-change-me-please-use-a-long-random-secret-at-least-32-chars}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8080:8080"
    networks:
      - maintenance-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: maintenance-frontend
    depends_on:
      - api-gateway
    ports:
      - "3000:3000"
    networks:
      - maintenance-net

  tenant-service:
    build: ./tenant-service
    container_name: maintenance-tenant-service
    depends_on:
      postgres:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-maintenance_db}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "8082:8082"
    networks:
      - maintenance-net

  # ---------------------------------------------------------------------------
  # EXTENSION POINT: utility-service (Utility & Billing: index_logs, bills)
  # Same procedure; gateway routes /api/utilities/** to UTILITY_SERVICE_URL
  # (default http://utility-service:8083).
  # ---------------------------------------------------------------------------
  # utility-service:
  #   build: ./utility-service
  #   container_name: maintenance-utility-service
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     liquibase:
  #       condition: service_completed_successfully
  #   environment:
  #     SERVER_PORT: 8083
  #     DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-maintenance_db}
  #     DB_USERNAME: ${POSTGRES_USER:-postgres}
  #     DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  #   ports:
  #     - "8083:8083"
  #   networks:
  #     - maintenance-net

networks:
  maintenance-net:
    driver: bridge

volumes:
  postgres_data:
