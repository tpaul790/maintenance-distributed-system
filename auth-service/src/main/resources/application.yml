server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/maintenance_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none # schema is owned by Liquibase
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-a-long-random-secret-at-least-32-chars}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cookie:
    name: jwt_token

management:
  endpoints:
    web:
      exposure:
        include: health
