server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

gateway:
  routes:
    auth-service-url: ${AUTH_SERVICE_URL:http://auth-service:8081}
    tenant-service-url: ${TENANT_SERVICE_URL:http://tenant-service:8082}
    utility-service-url: ${UTILITY_SERVICE_URL:http://utility-service:8083}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-a-long-random-secret-at-least-32-chars}
    cookie-name: jwt_token

management:
  endpoints:
    web:
      exposure:
        include: health
